# Overlay for reviewer.niresh.tech. Not applied. Use with compose.release.yml:
#   docker compose -f compose.release.yml -f docker-compose.hosted.yml config
# Do not run up. Traefik on this VPS is v2.11 with the Docker provider and
# network n8n-mkvx_proxy.

services:
  api:
    networks:
      - default
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: n8n-mkvx_proxy
      traefik.http.routers.reviewer.rule: Host(`reviewer.niresh.tech`)
      traefik.http.routers.reviewer.entrypoints: websecure
      traefik.http.routers.reviewer.tls.certresolver: letsencrypt
      traefik.http.services.reviewer.loadbalancer.server.port: "8000"
      # Liveness is Docker's job (/health, no database, restart on failure).
      # Readiness is Traefik's (/ready runs select 1). If Neon is unreachable the
      # route is withdrawn instead of serving traffic the app cannot answer.
      traefik.http.services.reviewer.loadbalancer.healthcheck.path: /ready
      traefik.http.services.reviewer.loadbalancer.healthcheck.interval: 10s
      traefik.http.services.reviewer.loadbalancer.healthcheck.timeout: 3s

networks:
  proxy:
    external: true
    name: n8n-mkvx_proxy
