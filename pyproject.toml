[project]
name = "pr-reviewer"
version = "0.1.0"
description = "AI PR reviewer backend for FoodSpector"
requires-python = ">=3.12"
dependencies = [
  "certifi>=2026.7.22",
  "fastapi>=0.116.1",
  "httpx>=0.28.1",
  "keyring>=25.6.0",
  "pyjwt[crypto]>=2.10.1",
  "psycopg[binary,pool]>=3.2.9",
  "pydantic>=2.11.7",
  "python-dotenv>=1.1.1",
  "uvicorn[standard]>=0.35.0",
]

[project.scripts]
pr-reviewer-api = "pr_reviewer.web.app:main"
pr-reviewer-db-migrate = "pr_reviewer.db.migrate:main"
pr-reviewer-db-rebase-migration = "pr_reviewer.db.rebase_migration_checksum:main"
pr-reviewer-worker = "pr_reviewer.worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_reviewer"]

[dependency-groups]
dev = [
  "mypy>=1.17.1",
  "pytest>=8.4.1",
  "pytest-cov>=6.2.1",
  "ruff>=0.12.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
disallow_untyped_defs = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
