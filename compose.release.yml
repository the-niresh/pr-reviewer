services:
  api:
    build:
      context: .
      target: api
    user: "65532:65532"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      GITHUB_APP_ID: ${GITHUB_APP_ID:?GITHUB_APP_ID must be set}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:?GITHUB_APP_PRIVATE_KEY must be set}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:?GITHUB_OAUTH_CLIENT_ID must be set}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:?GITHUB_OAUTH_CLIENT_SECRET must be set}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET must be set}
      PR_REVIEWER_HOSTED_ORIGIN: ${PR_REVIEWER_HOSTED_ORIGIN:?PR_REVIEWER_HOSTED_ORIGIN must be set}
    stop_grace_period: 30s
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  worker:
    build:
      context: .
      target: worker
    user: "65532:65532"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
    stop_grace_period: 30s

  ui:
    build:
      context: .
      target: ui
    user: "65532:65532"
    environment:
      NEXT_PUBLIC_CONTROL_PLANE_ORIGIN: ${PR_REVIEWER_HOSTED_ORIGIN:?PR_REVIEWER_HOSTED_ORIGIN must be set}
    stop_grace_period: 15s
