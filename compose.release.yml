services:
  api:
    build:
      context: .
      target: api
    image: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    user: "65532:65532"
    command: ["sleep", "3600"]
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD", "true"]
      interval: 2s
      timeout: 3s
      retries: 3
      start_period: 1s

  worker:
    build:
      context: .
      target: worker
    image: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    user: "65532:65532"
    command: ["sleep", "3600"]
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD", "true"]
      interval: 2s
      timeout: 3s
      retries: 3
      start_period: 1s

  ui:
    build:
      context: .
      target: ui
    image: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    user: "65532:65532"
    command: ["sleep", "3600"]
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD", "true"]
      interval: 2s
      timeout: 3s
      retries: 3
      start_period: 1s

  sandbox:
    build:
      context: .
      target: sandbox
    image: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    user: "65532:65532"
    command: ["sleep", "3600"]
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD", "true"]
      interval: 2s
      timeout: 3s
      retries: 3
      start_period: 1s
